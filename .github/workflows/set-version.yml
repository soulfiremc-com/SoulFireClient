name: Set Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to set"
        required: true
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  set-version:
    name: Set Version
    permissions:
      contents: write
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          check-latest: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Set package version
        run: |
          bun pm pkg set version="${INPUTS_VERSION}"
          bun install --lockfile-only
        env:
          INPUTS_VERSION: ${{ inputs.version }}

      - name: Add release to metainfo
        run: |
          if ! grep -q "<release version=\"${INPUTS_VERSION}\"" com.soulfiremc.soulfire.metainfo.xml; then
            sed -i "/<releases>/a\\
              <release version=\"${INPUTS_VERSION}\" date=\"$(date +"%Y-%m-%d")\">\\
                <url type=\"details\">https://github.com/soulfiremc-com/SoulFireClient/releases/tag/${INPUTS_VERSION}</url>\\
              </release>" com.soulfiremc.soulfire.metainfo.xml
            echo "Added release ${INPUTS_VERSION} to metainfo file"
          else
            echo "Release version ${INPUTS_VERSION} already exists in metainfo file, skipping addition"
          fi
        env:
          INPUTS_VERSION: ${{ inputs.version }}

      - name: Commit version
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "chore(release): bump version to ${{ inputs.version }}"
