name: Upload translations to Crowdin

on:
  workflow_dispatch:
  # Runs only after a merge. The job checks out trusted main and reads the PR
  # file list as data, so no pull request code runs with the Crowdin secrets.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [closed]
    branches: [main]
    paths:
      - "locales/**/*.json"

permissions:
  contents: read
  pull-requests: read

jobs:
  upload-translations:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged &&
       !(github.event.pull_request.head.repo.full_name == github.repository &&
         github.event.pull_request.head.ref == 'l10n_crowdin_translations'))
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Use trusted main after merge, including for PRs from forks.
          ref: main
          persist-credentials: false
      - name: Prepare changed translations
        if: github.event_name == 'pull_request_target'
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" > "$RUNNER_TEMP/crowdin-files.json"
          node scripts/prepare-crowdin-upload.mjs . "$RUNNER_TEMP/crowdin-files.json" .crowdin-upload >> "$GITHUB_OUTPUT"
      - name: Upload sources and translations
        uses: crowdin/github-action@d651c77756acbe11a31d77a6fb79d8a239e1e05a # v3.6.0
        with:
          config: crowdin.yml
          base_path: ${{ github.event_name == 'pull_request_target' && '.crowdin-upload' || '.' }}
          upload_sources: true
          # No upload_language filter: upload all enabled target languages.
          upload_translations: ${{ github.event_name == 'workflow_dispatch' || steps.prepare.outputs.has_translations == 'true' }}
          auto_approve_imported: false
          import_eq_suggestions: false
          download_translations: false
          push_translations: false
          create_pull_request: false
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
