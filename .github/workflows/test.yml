name: Test

on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  test:
    name: Build and Test

    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          check-latest: true

      - name: Install dependencies
        run: bun ci

      - name: Verify protocol bindings
        run: |
          bun run protocol:generate
          git diff --exit-code -- src/generated
          test -z "$(git ls-files --others --exclude-standard src/generated)"

      - name: Run typecheck
        run: bun run typecheck

      - name: Run check
        run: bun run check

      - name: Run deployment tests
        run: bun run test:deployment

      - name: Run terminal tests
        run: bun run test:terminal

      - name: Run file-watch regression tests
        run: bun run test:fs-watch

      - name: Run proxy-check regression tests
        run: bun test src/lib/proxy-check.test.ts

      - name: Run web build
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ github.event_name == 'push' && secrets.POSTHOG_PERSONAL_API_KEY || '' }}
        run: bun run build:web

      - name: Build Storybook
        run: bun run build:storybook

      - name: Install Chromium for component tests
        run: bunx playwright install --with-deps chromium

      - name: Run Storybook component tests
        env:
          # Reclaim removed iframe heaps between files on the CI browser worker.
          # https://github.com/vitest-dev/vitest/pull/10912
          VITEST_CHROMIUM_GC_DISK_THRESHOLD_GB: 1024
        run: bun run test:storybook
