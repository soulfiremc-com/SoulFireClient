name: Deploy Web

on:
  push:
    branches:
      - main
      - release
  pull_request:

permissions:
  contents: read

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    name: Deploy to Cloudflare
    # Pull requests from forks get no secrets, so they cannot deploy a preview.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: write
    env:
      CF_SEND_TELEMETRY: "false"
      # `release` serves app.soulfiremc.com. Everything else uses the preview channel.
      MODE: ${{ github.ref == 'refs/heads/release' && 'production' || 'preview' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
          # Do not restore caches into a job that deploys.
          no-cache: true

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          check-latest: true
          package-manager-cache: false

      - name: Install dependencies
        run: bun ci

      - name: Run deployment tests
        run: bun run test:deployment

      - name: Build
        if: github.event_name == 'push'
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
        run: bunx cf build --mode "$MODE"

      - name: Deploy
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx cf deploy --prebuilt --mode "$MODE"

      - name: Deploy pull request preview
        id: preview
        if: github.event_name == 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          bunx cf previews deploy --mode preview "pr-$PR_NUMBER" > preview.json
          url=$(jq -r '(.preview_urls // .deployment_urls)[0]' preview.json)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.preview.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --edit-last --create-if-none \
            --body "Web preview for ${SHA:0:7}: $URL"
